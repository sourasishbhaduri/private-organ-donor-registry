name: Midnight dApp CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Verify Compiled Contract Artifacts
        run: |
          echo "Verifying pre-compiled Compact contract artifacts..."
          test -f contracts/managed/organ-donor-registry/contract/index.js || (echo "ERROR: compiled contract index.js not found" && exit 1)
          test -f contracts/managed/organ-donor-registry/contract/index.d.ts || (echo "ERROR: compiled contract index.d.ts not found" && exit 1)
          echo "Contract artifacts OK."

      - name: Run Unit Tests
        run: npm test

      - name: Type-check Root TypeScript
        run: npx tsc --noEmit

      - name: Build Frontend Application
        run: |
          cd frontend
          npm ci
          npm run build
